name: Deploy via rsync and remote command

on:
  workflow_call:
    inputs:
      deploy_path:
        required: true
        type: string
      rsync_exclude:
        required: false
        type: string
        default: ".git .github node_modules .env .env.* .DS_Store dist bin"
      rsync_delete:
        required: false
        type: boolean
        default: false
      pre_command:
        required: false
        type: string
        default: ""
      remote_command:
        required: true
        type: string
      health_url:
        required: false
        type: string
        default: ""
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      HOST:
        required: true
      USER:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4
    steps:
      - uses: actions/checkout@v4

      - name: add ssh key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: run local pre-command
        if: inputs.pre_command != ''
        run: |
          set -euo pipefail
          ${{ inputs.pre_command }}

      - name: rsync to vps
        run: |
          set -euo pipefail
          EXCLUDES=""
          for item in ${{ inputs.rsync_exclude }}; do
            EXCLUDES="$EXCLUDES --exclude=$item"
          done
          if [ "${{ inputs.rsync_delete }}" = "true" ]; then
            DELETE_FLAG="--delete"
          else
            DELETE_FLAG=""
          fi
          rsync -avz -e "ssh ${{ env.SSH_OPTS }}" $DELETE_FLAG $EXCLUDES ./ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ inputs.deploy_path }}

      - name: run remote deploy command
        run: |
          set -euo pipefail
          ssh ${{ env.SSH_OPTS }} ${{ secrets.USER }}@${{ secrets.HOST }} '${{ inputs.remote_command }}'

      - name: verify health publicly
        if: inputs.health_url != ''
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if health=$(curl -fsS --max-time 15 ${{ inputs.health_url }}); then
              echo "public health: $health"
              exit 0
            fi
            sleep 2
          done
          echo "public health check failed" >&2
          exit 1

      - name: job summary
        if: always()
        run: |
          echo "## Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remote path: \`${{ inputs.deploy_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
